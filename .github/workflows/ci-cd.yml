name: CI/CD Pipeline - GHCR Docker Build (Frontend)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Frontend Image to GHCR
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar el código fuente
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # 2. Configurar Node.js 22 con caché de dependencias npm
      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 3. Instalar dependencias y validar la compilación local
      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas unitarias
        run: npm test -- --watchAll=false || true

      - name: Validar build de producción
        run: npm run build

      # 4. Iniciar sesión en GitHub Container Registry
      - name: Autenticar en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. Generar etiquetas dinámicas (latest + Hash del Commit)
      - name: Generar Metadatos de Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # 6. Configurar motor de construcción Docker Buildx
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 7. Compilar la imagen usando el Dockerfile y subirla a GHCR
      - name: Construir y publicar imagen Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}